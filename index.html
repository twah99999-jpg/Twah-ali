<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فكّر بذكاء واصنع الفرق</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fdf6ec;--card:#fff;--tx:#3b2f2f;--pr:#e07a3f;--pr2:#7b5ea7;--ok:#2e9e6b;--no:#d64545;--bd:#f0d9c0}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1a22;--card:#2a2430;--tx:#f3e9ee;--bd:#443a4d}}
:root[data-theme="dark"]{--bg:#1e1a22;--card:#2a2430;--tx:#f3e9ee;--bd:#443a4d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.7}
.w{max-width:760px;margin:auto;padding:14px}
header{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-radius:20px;padding:20px;text-align:center}
header h1{margin:0;font-size:1.7rem}header p{margin:6px 0 0;opacity:.95;font-size:.95rem}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:16px 0}
.c{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:14px;text-align:center}
.c .i{font-size:2rem}.c h3{margin:4px 0 8px;font-size:1rem}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:9px 14px;background:var(--pr);color:#fff;margin:2px}
button.s{background:var(--pr2)}button.o{background:var(--card);color:var(--tx);border:2px solid var(--bd);width:100%;text-align:right;margin:5px 0;padding:12px}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}button.no{background:var(--no);color:#fff;border-color:var(--no)}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--ok)}
.q{font-size:1.3rem;font-weight:700;margin:12px 0}
table{width:100%;border-collapse:collapse;background:var(--card)}td,th{border:1px solid var(--bd);padding:8px;text-align:center}th{background:var(--bd)}
.ov{overflow-x:auto}.big{font-size:3rem;text-align:center}
.cert{background:#fffdf5;color:#3b2f2f;border:8px double #c9962b;border-radius:16px;padding:26px 14px;text-align:center;margin-top:14px}
.cert h2{color:#7b5ea7;font-size:1.6rem;margin:6px 0}.cert .nm{font-size:1.9rem;font-weight:700;color:#e07a3f;border-bottom:2px dotted #c9962b;display:inline-block;padding:0 24px;margin:8px 0}
.cert .sg{display:flex;justify-content:space-around;margin-top:22px;font-size:.9rem}
input{font:inherit;padding:10px;border-radius:10px;border:2px solid var(--bd);width:100%;max-width:340px;background:var(--card);color:var(--tx);text-align:center}
@media print{header,footer,.np{display:none!important}body{background:#fff}}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#7048e8,#d6336c 55%,#f08c00);color:#fff;border-radius:26px;padding:22px 14px 18px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.18)}
.hero h1{margin:4px 0;font-size:1.9rem;text-shadow:0 3px 0 rgba(0,0,0,.2)}.hero p{margin:4px 0 0;font-size:.95rem}
.mas{font-size:4rem;display:inline-block;animation:bob 2s ease-in-out infinite}
.fl{position:absolute;font-size:1.6rem;opacity:.55;animation:bob 3s ease-in-out infinite}
.bub{display:inline-block;background:#fff;color:#5b3a8c;border-radius:18px;padding:6px 14px;font-weight:700;margin-top:6px}
@keyframes bob{50%{transform:translateY(-9px) rotate(4deg)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
.stat{display:flex;gap:8px;justify-content:center;margin:14px 0 8px;flex-wrap:wrap}.stat span{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:4px 14px;font-weight:700}
.big2{display:block;width:100%;font-size:1.2rem;font-weight:700;background:linear-gradient(90deg,#f08c00,#e03131);padding:14px;border-radius:18px;box-shadow:0 5px 0 #a02020}
.c.k{background:linear-gradient(150deg,var(--a),color-mix(in srgb,var(--a) 65%,#000));color:#fff;border:0;box-shadow:0 6px 0 color-mix(in srgb,var(--a) 55%,#000);transition:.2s}
.c.k:hover{transform:translateY(-4px) rotate(-1deg)}.c.k .i{font-size:2.8rem;animation:bob 2.4s infinite}.c.k .st{font-size:1.2rem;min-height:1.8rem}
.w2{background:#fff;color:#333;font-weight:700}
.qc{border:3px solid var(--a);box-shadow:0 6px 0 var(--a)}.qc .tag{background:var(--a);color:#fff;border-radius:12px;padding:3px 12px;display:inline-block}
.o:hover:not(:disabled){border-color:var(--a);transform:scale(1.02)}.qc .bar i{background:var(--a)}
.shake{animation:shake .4s}.lh{background:var(--a);color:#fff;border-radius:14px;padding:10px;text-align:center}
.cf{position:fixed;top:-30px;z-index:9;font-size:1.6rem;animation:fall 2.6s linear forwards;pointer-events:none}
.run{position:absolute;bottom:2px;font-size:1.8rem;animation:run 10s linear infinite}
@keyframes run{from{left:-12%}to{left:108%}}
.hero .fl:nth-child(odd){animation:tw 1.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(1.5) rotate(20deg)}}
.big2{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.04)}}
.c.k{animation:pop .6s backwards}@keyframes pop{from{opacity:0;transform:scale(.5) translateY(30px)}}
.hero h1{animation:glow 2.5s ease-in-out infinite}@keyframes glow{50%{text-shadow:0 0 18px #fff,0 3px 0 rgba(0,0,0,.2)}}
.bb{position:fixed;bottom:-70px;border-radius:50%;background:rgba(224,122,63,.18);animation:up 14s linear infinite;pointer-events:none;z-index:0}
@keyframes up{to{transform:translateY(-118vh) translateX(30px)}}
.w{position:relative;z-index:1}
.qc{animation:pop .4s}
footer{text-align:center;font-size:.85rem;opacity:.85;margin:20px 0}
</style></head><body><i class="bb" style="left:6%;width:40px;height:40px"></i><i class="bb" style="left:24%;width:70px;height:70px;animation-delay:-4s"></i><i class="bb" style="left:46%;width:30px;height:30px;animation-delay:-8s"></i><i class="bb" style="left:63%;width:56px;height:56px;animation-delay:-2s"></i><i class="bb" style="left:80%;width:44px;height:44px;animation-delay:-10s"></i><i class="bb" style="left:92%;width:64px;height:64px;animation-delay:-6s"></i><div class="w">
<header class="hero"><span class="fl" style="right:8%;top:10px">✨</span><span class="fl" style="left:8%;top:14px;animation-delay:.6s">⭐</span><span class="fl" style="right:20%;bottom:8px;animation-delay:1s">📚</span><span class="fl" style="left:18%;bottom:10px;animation-delay:1.4s">🎈</span><span class="run">🐇</span><span class="run" style="animation-duration:16s;animation-delay:-5s">🐢</span><span class="run" style="animation-duration:7s;animation-delay:-2s;bottom:30px">🦋</span><div class="mas">🦉</div><h1>فكّر بذكاء واصنع الفرق</h1><p>مغامرة ممتعة لتقوية القدرات اللفظية</p><div class="bub">هيّا نلعب ونتعلّم ونجمع النجوم! 🌟</div></header>
<main id="m"></main>
<footer>إعداد المعلمة: أ/ طوعة الناصر<br>مديرة المدرسة: أ/ سهاد الكشي<br>مدرسة الثانوية بالحليلة</footer></div>
<script>
const P=s=>s.split('|').map(x=>x.split(':'));
const CT=P('السعودية:الرياض:جدة:الريال السعودي|الكويت:الكويت:الكويت:الدينار الكويتي|البحرين:المنامة:المنامة:الدينار البحريني|الإمارات:أبو ظبي:دبي:الدرهم الإماراتي|عمان:مسقط:صلالة:الريال العماني|الأردن:عمّان:العقبة:الدينار الأردني|سوريا:دمشق:اللاذقية:الليرة السورية|العراق:بغداد:البصرة:الدينار العراقي|المغرب:الرباط:طنجة:الدرهم المغربي|الجزائر:الجزائر:وهران:الدينار الجزائري|تونس:تونس:بنزرت:الدينار التونسي|مصر:القاهرة:الاسكندرية:الجنيه المصري|اليمن:صنعاء:عدن:الريال اليمني');
const C=[
{n:'الحيوان والذكر والأنثى',i:'🐑',q:a=>a,h:['السؤال','الجواب'],d:P('أنثى الأسد:لبوة|أنثى الديك:دجاجة|أنثى الثور:بقرة|أنثى الجمل:ناقة|أنثى الحمار:أتان|أنثى الكبش:نعجة|أنثى الفأر:فأرة|أنثى الكلب:كلبة|أنثى الخنزير:خنزيرة|أنثى الظبي:ظبية|أنثى العصفور:عصفورة|أنثى الحمام:حمامة|ذكر النعام:ظليم|أنثى النعام:نعامة|أنثى البوم:بومة')},
{n:'علاقة الحيوان وصوته',i:'🔊',q:a=>'ما صوت '+a+'؟',h:['الحيوان','صوته'],d:P('أرنب:ضغيب|بغل:شحيج|ذئب:عواء|خروف:مأمأة|أسد:زئير|بلبل:تغريد|خنزير:خنخنة|أفعى:فحيح|بومة:نعيق|عصفور:زقزقة|خيل:صهيل|دجاجة:نقنقة|حمار:نهيق|بقرة:خوار|ديك:صياح|ضفدع:نقيق|غنم:ثغاء|قط:مواء|كلب:نباح|حمامة:هديل|ناقة:رغاء|ذبابة:أزيز|بطة:بطبطة')},
{n:'علاقة اسم الحيوان واسم صغير الحيوان',i:'🐣',q:a=>'ما اسم صغير '+a+'؟',h:['الحيوان','صغيره'],d:P('أرنب:خرنق|أسد:شبل|ثور:عجل|ضب:حسل|فيل:دغفل|قط:هر|كلب:جرو|حمار:جحش|جمل:حوار|خيل:مهر|دب:ديسم|ذئب:سمع|خروف:حمل|ظبي:خشف|ماعز:جدي')},
{n:'علاقة الحيوان واسم بيته',i:'🏠',q:a=>'ما اسم بيت '+a+'؟',h:['الحيوان','بيته'],d:P('أرنب:جحر|أسد:عرين|ثور:زريبة|فيل:أجمة|نحل:خلية|ثعلب:وجار|ديك:قن|عنكبوت:شبكة|صقر:وكر|جمل:مراح|غزال:كناس|نمل:قرية')},
{n:'الدولة والعاصمة',i:'🏙️',q:a=>'ما عاصمة '+a+'؟',h:['الدولة','العاصمة'],d:CT.map(r=>[r[0],r[1]])},
{n:'الدولة والميناء',i:'⚓',q:a=>'ما ميناء '+a+'؟',h:['الدولة','الميناء'],d:CT.map(r=>[r[0],r[2]])},
{n:'الدولة والعملة',i:'💰',q:a=>'ما عملة '+a+'؟',h:['الدولة','العملة'],d:CT.map(r=>[r[0],r[3]])},
{n:'علاقة الترادف',i:'🔗',q:a=>'ما مرادف «'+a+'»؟',h:['الكلمة','مرادفها'],d:P('جود:كرم|الأجداث:القبور|شفافية:وضوح|بحبوحة:رخاء|أعانه:ساعده|حبور:سرور|عمود:سارية|حوراء:بيضاء|اقتناء:اتخاذ|أرسل:بعث|كرسي:مقعد|عتيق:قديم|ملخص:موجز|عصيان:تمرد|استغراب:تعجب|زميل:رفيق|أخ:شقيق|رؤى:أحلام|تمام:كمال|بحر:يم|جبل:طود|غيم:سحب|سيف:مهند|ريادة:قيادة|هيمن:سيطر|العسجد:الذهب|شجاع:مقدام|منزل:بيت|ماهر:حاذق|زيادة:نماء|بعير:جمل|سقم:مرض|هم:غم|مسكين:فقير|حطام:هشيم|جواد:كريم')},
{n:'علاقة التضاد',i:'⚖️',q:a=>'ما ضد «'+a+'»؟',h:['الكلمة','ضدها'],d:P('جدير:حقير|فاشل:ناجح|طيش:تعقل|عدل:ظلم|يخسر:يفوز|عالي:سافل|خشن:ناعم|سر:علن|مرسل:مستقبل|جبن:شجاعة|همس:جهر|غامض:واضح|خصب:جدب|سراء:ضراء|تقوى:فجور|فرح:تعيس|ألفة:نفور|تفريط:إفراط|نشاط:كسل|وعر:سهل|عقوق:بر|إقبال:إدبار|ليل:نهار|شرق:غرب|كثرة:قلة|حقد:تسامح|ذهاب:إياب|صراخ:صمت|أمانة:خيانة|كرم:بخل|اتصال:انقطاع|تأخر:تقدم|قوي:ضعيف|اتفق:اختلف|أخذ:أعطى|صبر:جزع|ضحك:بكاء|بعيد:قريب|عسر:يسر|رطوبة:جفاف')}
];
const $=id=>document.getElementById(id),m=$('m');
let S={};try{S=JSON.parse(localStorage.getItem('fk')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('fk',JSON.stringify(S))}catch(e){}};
const sh=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const COL=['#e8590c','#d6336c','#7048e8','#1c7ed6','#0ca678','#f08c00','#c2255c','#2f9e44','#e03131'];let st=0;
function boom(n){const e=['🎉','⭐','🎊','✨','🌟'];for(let i=0;i<n;i++){const x=document.createElement('span');x.className='cf';x.textContent=e[i%5];x.style.left=Math.random()*95+'%';x.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(x);setTimeout(()=>x.remove(),3600)}}
const stars=p=>p>=90?'⭐⭐⭐':p>=60?'⭐⭐':p>=30?'⭐':'☆';
function home(){
 const f=Object.values(S).filter(v=>v>=100).length,tot=Object.values(S).reduce((a,b)=>a+b,0);
 m.innerHTML='<div class="stat"><span>🏆 '+tot+' نقطة</span><span>🎖️ '+f+' من '+C.length+' شهادات</span></div><button class="big2" onclick="quiz(-1)">🎯 ابدئي المسابقة الشاملة</button><div class="g">'+C.map((c,k)=>'<div class="c k" style="--a:'+COL[k]+';animation-delay:'+(k*.08)+'s"><div class="i">'+c.i+'</div><h3>'+c.n+'</h3><div class="st">'+stars(S[k]||0)+'</div><button class="w2" onclick="learn('+k+')">📖 تعلّم</button><button class="w2" onclick="quiz('+k+')">✏️ تدرّب</button></div>').join('')+'</div>';
 window.scrollTo(0,0)}
function learn(k){const c=C[k];
 m.innerHTML='<h2 class="lh" style="--a:'+COL[k]+'">'+c.i+' '+c.n+'</h2><div class="ov"><table><tr><th>'+c.h[0]+'</th><th>'+c.h[1]+'</th></tr>'+c.d.map(r=>'<tr><td>'+r[0]+'</td><td><b>'+r[1]+'</b></td></tr>').join('')+'</table></div><p><button onclick="quiz('+k+')">ابدئي التدريب</button><button class="s" onclick="home()">الرئيسية</button></p>';window.scrollTo(0,0)}
let Q,qi,sc,k0;
function quiz(k){k0=k;
 const pool=k<0?C.flatMap((c,j)=>c.d.map(r=>({c:j,r}))):C[k].d.map(r=>({c:k,r}));
 Q=sh(pool).slice(0,10).map(o=>{const c=C[o.c],ans=o.r[1];
  const op=sh([...new Set(c.d.map(r=>r[1]).filter(x=>x!==ans))]).slice(0,3);
  return{t:c.q(o.r[0]),a:ans,o:sh([ans,...op]),n:c.n,j:o.c}});
 qi=0;sc=0;st=0;ask()}
function ask(){const q=Q[qi];
 m.innerHTML='<div class="c qc" style="--a:'+COL[q.j]+';margin-top:14px;text-align:right"><div>السؤال '+(qi+1)+' من '+Q.length+' · ⭐ '+sc+(st>1?' · 🔥 '+st+' متتالية':'')+'</div><div class="bar"><i style="width:'+qi/Q.length*100+'%"></i></div><span class="tag">'+q.n+'</span><div class="q">'+q.t+'</div>'+q.o.map((x,j)=>'<button class="o" onclick="pick(this,'+j+')">'+x+'</button>').join('')+'<div id="f"></div></div>';window.scrollTo(0,0)}
function pick(b,j){const q=Q[qi],ok=q.o[j]===q.a;
 document.querySelectorAll('.o').forEach((x,i)=>{x.disabled=true;if(q.o[i]===q.a)x.classList.add('ok')});
 if(ok){sc++;st++;boom(6)}else{st=0;b.classList.add('no','shake')}
 $('f').innerHTML='<p>'+(ok?'🎉 أحسنتِ! إجابة صحيحة':'💡 الإجابة الصحيحة: <b>'+q.a+'</b>')+'</p><button onclick="nxt()">'+(qi<Q.length-1?'التالي ◀':'النتيجة')+'</button>'}
function nxt(){qi++;if(qi<Q.length)ask();else done()}
function done(){const p=Math.round(sc/Q.length*100);if(p>=60)boom(35);
 if(k0>=0&&p>(S[k0]||0)){S[k0]=p;save()}
 m.innerHTML='<div class="c" style="margin-top:14px"><div class="big">'+stars(p)+'</div><h2>'+(p>=90?'رائعة! أنتِ مفكّرة ذكية':p>=60?'أداء جميل، واصلي التقدم':'لا بأس، التدريب يصنع الفرق')+'</h2><p>نتيجتك: '+sc+' من '+Q.length+' ('+p+'%)</p>'+(k0>=0&&sc===Q.length?'<p>🌟 أجبتِ عن جميع الأسئلة بلا أخطاء!</p><button style="background:#c9962b" onclick="cert()">🏅 احصلي على شهادتك</button>':'')+'<button onclick="quiz('+k0+')">🔁 محاولة جديدة</button><button class="s" onclick="home()">الرئيسية</button></div>'}
function cert(){m.innerHTML='<div class="c" style="margin-top:14px"><h3>🏅 اكتبي اسمك لتظهر على الشهادة</h3><input id="nm" placeholder="اسم الطالبة" maxlength="40"><p><button onclick="mk()">إصدار الشهادة</button></p></div>'}
function mk(){boom(45);const n=$('nm').value.trim();if(!n){$('nm').placeholder='اكتبي اسمك أولاً ✍️';return}
 m.innerHTML='<div class="cert"><div style="font-size:2.4rem">🏅</div><div>مدرسة الثانوية بالحليلة</div><h2>شهادة تفوّق وشكر</h2><div>تشهد مبادرة «فكّر بذكاء واصنع الفرق» بأن الطالبة</div><div class="nm">'+n+'</div><div>قد أتمّت قسم «'+C[k0].n+'» بنجاح، وأجابت عن جميع الأسئلة إجابة صحيحة</div><div style="margin-top:8px">'+new Date().toLocaleDateString('ar-SA')+'</div><div class="sg"><div>إعداد المعلمة<br><b>أ/ طوعة الناصر</b></div><div>مديرة المدرسة<br><b>أ/ سهاد الكشي</b></div></div></div><p class="np" style="text-align:center"><button onclick="window.print()">🖨️ طباعة</button><button class="s" onclick="home()">الرئيسية</button></p>'}
home();
</script></body></html>
